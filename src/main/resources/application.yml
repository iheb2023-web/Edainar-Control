server:
  port: 8080

spring:
  application:
    name: edinar-control-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/edinar_control}
    username: ${SPRING_DATASOURCE_USERNAME:edinar}
    password: ${SPRING_DATASOURCE_PASSWORD:edinar}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.edinar.control.domain
  type-handlers-package: com.edinar.control.config
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}