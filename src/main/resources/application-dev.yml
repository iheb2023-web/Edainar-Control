spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/edinar_control}
    username: ${SPRING_DATASOURCE_USERNAME:edinar}
    password: ${SPRING_DATASOURCE_PASSWORD:edinar}
  flyway:
    clean-disabled: true

app:
  jwt:
    secret: ${JWT_SECRET:edinar-control-dev-secret-change-me-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
